<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wijnkelder</title>
  <meta name="description" content="Je wijnvoorraad op zak, met een AI-sommelier die bij elk gerecht een fles uit je eigen kelder kiest.">
  <meta name="theme-color" content="#120d11" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f0f1" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wijnkelder">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;600;700;800&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script>
    // Thema zo vroeg mogelijk zetten, zodat het scherm niet flitst
    try { const t = JSON.parse(localStorage.getItem('wijnkelder.settings'))?.theme; if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <main id="app"><div class="view"><p class="muted">Kelder openen...</p></div></main>

  <div class="tabs">
    <nav aria-label="Hoofdmenu">
      <button data-tab="vandaag" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h10l-1 7a4 4 0 0 1-8 0L7 3Z"/><path d="M12 14v6M8.5 21h7"/></svg>
        Vandaag
      </button>
      <button data-tab="kelder">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-6 9 6v12"/><path d="M7 21v-6h10v6M7 18h10"/></svg>
        Kelder
      </button>
      <button data-action="add" class="plus" aria-label="Fles toevoegen">
        <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>
      </button>
      <button data-tab="sommelier">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/><path d="M9 11h.01M12 11h.01M15 11h.01"/></svg>
        Sommelier
      </button>
      <button data-tab="meer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        Meer
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
