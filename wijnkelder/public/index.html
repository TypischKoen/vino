<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wijnkelder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍷 Wijnkelder</h1>
    <p id="stats" class="muted"></p>
    <p id="warnings" class="warn"></p>
  </header>

  <main>
    <section class="card pair">
      <h2>Wat eet je vandaag?</h2>
      <form id="pair-form">
        <input id="dish" placeholder="bv. stoofvlees met friet, of zalm uit de oven met citroen" autocomplete="off" required>
        <button type="submit">Kies een fles</button>
      </form>
      <div id="pair-result"></div>
    </section>

    <section class="card">
      <div class="row between">
        <h2>Voorraad</h2>
        <div class="row">
          <input id="filter" type="search" placeholder="Zoek in je kelder...">
          <label class="check"><input id="show-empty" type="checkbox"> ook op = 0</label>
        </div>
      </div>
      <div id="wines" class="wines"></div>
    </section>

    <section class="card">
      <h2>Wijn toevoegen</h2>
      <div class="row">
        <input id="google-q" placeholder="Zoek op Google, bv. 'Chateau Musar 2017'">
        <button id="google-btn" type="button" class="secondary">Zoek</button>
      </div>
      <div id="google-results"></div>
      <form id="add-form" class="grid">
        <input name="winery" placeholder="Producent">
        <input name="name" placeholder="Naam van de wijn">
        <input name="vintage" type="number" placeholder="Jaar" min="1900" max="2100">
        <select name="type">
          <option value="">Soort</option>
          <option>Rood</option><option>Wit</option><option>Rosé</option>
          <option>Mousserend</option><option>Dessert</option><option>Versterkt</option>
        </select>
        <input name="grape" placeholder="Druif / stijl">
        <input name="region" placeholder="Regio">
        <input name="country" placeholder="Land">
        <input name="quantity" type="number" min="0" value="1" placeholder="Aantal">
        <input name="drinkFrom" type="number" placeholder="Drinken vanaf">
        <input name="drinkUntil" type="number" placeholder="Drinken tot">
        <input name="notes" placeholder="Notitie" class="wide">
        <input name="webUrl" type="hidden">
        <input name="imageUrl" type="hidden">
        <input name="description" type="hidden">
        <button type="submit" class="wide">Toevoegen</button>
      </form>
    </section>

    <section class="card">
      <h2>Importeren uit Vivino</h2>
      <p class="muted">
        Vivino heeft geen openbare koppeling. Vraag je data op via vivino.com &rarr; Settings &rarr; Privacy &rarr; download je data,
        en upload hier de CSV (bv. <code>cellar.csv</code>). Zit er geen aantal-kolom in, dan telt elke wijn als 1 fles.
      </p>
      <div class="row">
        <input id="csv" type="file" accept=".csv,text/csv">
        <select id="import-mode">
          <option value="replace">Aantallen overschrijven</option>
          <option value="add">Aantallen optellen</option>
        </select>
        <button id="import-btn" type="button">Importeer</button>
      </div>
      <p id="import-result" class="muted"></p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
